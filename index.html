<!DOCTYPE html>
<html>
<head>
  <title>сухарики</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: "Comic Sans MS", cursive;
      overflow: hidden;
      cursor: crosshair;
    }

    h1 {
      position: absolute;
      width: 100%;
      top: 20%;
      text-align: center;
      font-size: 70px;
      animation: shake 0.2s infinite;
    }

    p {
      position: absolute;
      width: 100%;
      top: 35%;
      text-align: center;
    }

    button {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 30px;
      font-size: 20px;
      background: red;
      border: none;
      color: white;
      cursor: pointer;
    }

    .runaway {
      position: absolute;
    }

    @keyframes shake {
      0% { transform: translate(0,0); }
      25% { transform: translate(5px,-5px); }
      50% { transform: translate(-5px,5px); }
      75% { transform: translate(5px,5px); }
      100% { transform: translate(-5px,-5px); }
    }

    .floating {
      position: absolute;
      font-size: 30px;
      animation: float linear infinite;
    }

    @keyframes float {
      from { transform: translateY(100vh); }
      to { transform: translateY(-10vh); }
    }

    .error {
      position: absolute;
      background: white;
      color: black;
      padding: 10px;
      border: 2px solid black;
      font-size: 12px;
    }
  </style>
</head>

<body>

<h1>СУХАРИКИ</h1>
<p>emotionally unstable • certified crunchy</p>

<button id="btn">do not click</button>

<audio id="boom" src="https://www.myinstants.com/media/sounds/vine-boom.mp3"></audio>

<script>
const btn = document.getElementById("btn");

// RUNAWAY BUTTON 😭
btn.addEventListener("mouseover", () => {
  btn.style.top = Math.random() * 80 + "%";
  btn.style.left = Math.random() * 80 + "%";
});

// CLICK CHAOS
btn.addEventListener("click", () => {
  document.getElementById("boom").play();

  // flashing colors
  setInterval(() => {
    document.body.style.background =
      `rgb(${Math.random()*255},${Math.random()*255},${Math.random()*255})`;
  }, 100);

  // floating сухарики
  for (let i = 0; i < 80; i++) {
    let el = document.createElement("div");
    el.className = "floating";
    el.innerText = "сухарики";
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = (Math.random() * 3 + 1) + "s";
    document.body.appendChild(el);
  }

  // fake error popups
  setInterval(() => {
    let err = document.createElement("div");
    err.className = "error";
    err.style.top = Math.random() * 90 + "%";
    err.style.left = Math.random() * 90 + "%";
    err.innerText = "Error: too much crunch";
    document.body.appendChild(err);
  }, 500);

  // random redirect after chaos
  setTimeout(() => {
    window.location.href = "https://staggeringbeauty.com";
  }, 4000);
});

// RANDOM TEXT FOLLOWING CURSOR
document.addEventListener("mousemove", (e) => {
  let t = document.createElement("div");
  t.innerText = "сухарики";
  t.style.position = "absolute";
  t.style.left = e.pageX + "px";
  t.style.top = e.pageY + "px";
  t.style.fontSize = "10px";
  document.body.appendChild(t);

  setTimeout(() => t.remove(), 1000);
});
</script>

</body>
</html>
